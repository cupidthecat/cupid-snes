name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build POSIX execution context tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -pthread -Icore/include
          core/src/system/ExecutionContext.cpp tests/test_execution_context.cpp
          -o execution-context-tests
      - name: Test
        run: ./execution-context-tests
      - name: Build POSIX SA-1 core tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -pthread -Icore/include
          core/src/cpu/Processor65816.cpp core/src/cartridge/Sa1.cpp
          core/src/cartridge/Sa1Arithmetic.cpp core/src/cartridge/Sa1Dma.cpp
          core/src/cartridge/BsMemory.cpp
          core/src/system/ExecutionContext.cpp tests/test_sa1.cpp -o sa1-tests
      - name: Test SA-1 core
        run: ./sa1-tests
      - name: Build ARM processor tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include
          core/src/cpu/Arm6.cpp tests/test_arm6.cpp -o arm-tests
      - name: Test ARM processor
        run: ./arm-tests
      - name: Build HG51B processor tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include
          core/src/cpu/Hg51b.cpp core/src/cpu/Hg51bHost.cpp tests/test_hg51b.cpp -o hg51b-tests
      - name: Test HG51B processor
        run: ./hg51b-tests
      - name: Build SPC7110 coding and RTC tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include
          core/src/cartridge/Spc7110Decoder.cpp core/src/cartridge/Spc7110Rtc.cpp
          tests/test_spc7110_parts.cpp -o spc7110-parts-tests
      - name: Test SPC7110 coding and RTC
        run: ./spc7110-parts-tests
      - name: Build S-RTC calendar tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include
          core/src/cartridge/Srtc.cpp tests/test_srtc.cpp -o srtc-tests
      - name: Test S-RTC calendar
        run: ./srtc-tests
      - name: Build Super FX pixel and bus tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include
          core/src/cartridge/SuperFx.cpp tests/test_superfx.cpp -o superfx-tests
      - name: Test Super FX pixel and bus timing
        run: ./superfx-tests
      - name: Build and test handheld components
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Cpu.cpp tests/test_gameboy_cpu.cpp -o gameboy-cpu-tests
          ./gameboy-cpu-tests
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Host.cpp tests/test_gameboy_host.cpp -o gameboy-host-tests
          ./gameboy-host-tests
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/ClockedIo.cpp tests/test_gameboy_clocked_io.cpp -o gameboy-clock-tests
          ./gameboy-clock-tests
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Tpp1.cpp core/src/cartridge/gameboy/Camera.cpp core/src/cartridge/gameboy/Huc3Clock.cpp core/src/cartridge/gameboy/Infrared.cpp core/src/cartridge/gameboy/Cartridge.cpp core/src/cartridge/gameboy/MotionEeprom.cpp \
            tests/test_gameboy_cartridge.cpp -o gameboy-cartridge-tests
          ./gameboy-cartridge-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/{Tpp1,Camera,Huc3Clock,Infrared,Cartridge,MotionEeprom}.cpp \
            tests/test_gameboy_camera.cpp -o gameboy-camera-tests
          ./gameboy-camera-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/{Tpp1,Camera,Huc3Clock,Infrared,Cartridge,MotionEeprom}.cpp \
            tests/test_gameboy_tpp1.cpp -o gameboy-tpp1-tests
          ./gameboy-tpp1-tests
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Cpu.cpp core/src/cartridge/gameboy/ClockedIo.cpp \
            core/src/cartridge/gameboy/Host.cpp core/src/cartridge/gameboy/Tpp1.cpp core/src/cartridge/gameboy/Camera.cpp core/src/cartridge/gameboy/Huc3Clock.cpp core/src/cartridge/gameboy/Infrared.cpp core/src/cartridge/gameboy/Cartridge.cpp \
            core/src/cartridge/gameboy/MotionEeprom.cpp core/src/cartridge/gameboy/Machine.cpp \
            tests/test_gameboy_machine.cpp -o gameboy-machine-tests
          ./gameboy-machine-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Oam.cpp core/src/cartridge/gameboy/Video.cpp tests/test_gameboy_video.cpp -o gameboy-video-tests
          ./gameboy-video-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Oam.cpp tests/test_gameboy_oam.cpp -o gameboy-oam-tests
          ./gameboy-oam-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/ClockedIo.cpp core/src/cartridge/gameboy/SoundChannels.cpp \
            tests/test_gameboy_sound_channels.cpp -o gameboy-sound-tests
          ./gameboy-sound-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/ClockedIo.cpp core/src/cartridge/gameboy/SoundChannels.cpp \
            core/src/cartridge/gameboy/Audio.cpp tests/test_gameboy_audio.cpp -o gameboy-audio-tests
          ./gameboy-audio-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/{Cpu,ClockedIo,Host,Tpp1,Camera,Huc3Clock,Infrared,Cartridge,MotionEeprom,Machine,Oam,Video,SoundChannels,Audio,Peripherals}.cpp \
            tests/test_gameboy_peripherals.cpp -o gameboy-peripheral-tests
          ./gameboy-peripheral-tests
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Cache SDL build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: out/build/ci/_deps
          key: sdl-${{ runner.os }}-vs2022-${{ hashFiles('cmake/SDL3.cmake') }}
          restore-keys: sdl-${{ runner.os }}-vs2022-
      - name: Configure
        run: cmake -S . -B out/build/ci -G "Visual Studio 17 2022" -A x64 -DSNES_ENABLE_TESTS=ON -DSNES_ENABLE_LTO=OFF
      - name: Build
        run: cmake --build out/build/ci --config Release --parallel 4
      - name: Test
        run: ctest --test-dir out/build/ci -C Release --output-on-failure --parallel 4 --timeout 120
      - name: Configure optimized Release
        run: cmake -S . -B out/build/ci -DSNES_ENABLE_LTO=ON
      - name: Build optimized executables
        run: >-
          cmake --build out/build/ci --config Release --parallel 4 --target
          snes_frontend snes_rom_diagnostic snes_rom_smoke snes_trace_dump
          snes_gameboy_cpu_tests snes_gameboy_host_tests snes_gameboy_clocked_io_tests
          snes_gameboy_cartridge_tests snes_gameboy_camera_tests snes_gameboy_tpp1_tests snes_gameboy_oam_tests
          snes_gameboy_machine_tests snes_gameboy_video_tests snes_gameboy_sound_channels_tests snes_gameboy_audio_tests snes_gameboy_peripherals_tests
          snes_super_game_boy_tests
          snes_msu1_tests snes_msu1_integration_tests
          snes_power_on_state_tests snes_ppu_background_tests snes_ppu_object_tests snes_ppu_port_tests
          snes_dma_timing_tests
          snes_controller_tests snes_light_gun_tests
          snes_frame_execution_tests snes_competition_cartridge_tests
          snes_sdl_audio_tests snes_sdl_video_tests snes_bsx_tests snes_cartridge_command_tests
          snes_sdd1_tests snes_processor_startup_tests
          snes_cartridge_device_tests
          snes_superfx_tests snes_cartridge_processor_tests snes_cx4_processor_tests snes_sa1_tests
      - name: Test optimized console and SDL paths
        run: >-
          ctest --test-dir out/build/ci -C Release --output-on-failure --parallel 4 --timeout 120
          -R "^(snes_(gameboy_cpu|gameboy_host|gameboy_clocked_io|gameboy_cartridge|gameboy_camera|gameboy_tpp1|gameboy_oam|gameboy_machine|gameboy_video|gameboy_sound_channels|gameboy_audio|gameboy_peripherals|super_game_boy|msu1|msu1_integration|power_on_state|ppu_background|ppu_object|ppu_port|dma_timing|controller|light_gun|frame_execution|competition_cartridge|bsx|cartridge_command|cartridge_device|cartridge_processor|cx4_processor|sa1|superfx|sdd1|processor_startup|sdl_video)_tests|snes_sdl_audio_(32000|32040|44100|48000))$"
