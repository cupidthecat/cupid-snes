name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build POSIX execution context tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -pthread -Icore/include
          core/src/system/ExecutionContext.cpp tests/test_execution_context.cpp
          -o execution-context-tests
      - name: Test
        run: ./execution-context-tests
      - name: Build POSIX SA-1 core tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -pthread -Icore/include
          core/src/cpu/Processor65816.cpp core/src/cartridge/Sa1.cpp
          core/src/cartridge/Sa1Arithmetic.cpp core/src/cartridge/Sa1Dma.cpp
          core/src/cartridge/BsMemory.cpp core/src/system/PowerOnState.cpp
          core/src/system/ExecutionContext.cpp tests/test_sa1.cpp -o sa1-tests
      - name: Test SA-1 core
        run: ./sa1-tests
      - name: Build ARM processor tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include
          core/src/cpu/Arm6.cpp tests/test_arm6.cpp -o arm-tests
      - name: Test ARM processor
        run: ./arm-tests
      - name: Build HG51B processor tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include
          core/src/cpu/Hg51b.cpp core/src/cpu/Hg51bHost.cpp tests/test_hg51b.cpp -o hg51b-tests
      - name: Test HG51B processor
        run: ./hg51b-tests
      - name: Build SPC7110 coding and RTC tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include
          core/src/cartridge/Spc7110Decoder.cpp core/src/cartridge/Spc7110Rtc.cpp
          tests/test_spc7110_parts.cpp -o spc7110-parts-tests
      - name: Test SPC7110 coding and RTC
        run: ./spc7110-parts-tests
      - name: Build S-RTC calendar tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include
          core/src/cartridge/Srtc.cpp tests/test_srtc.cpp -o srtc-tests
      - name: Test S-RTC calendar
        run: ./srtc-tests
      - name: Build Super FX pixel and bus tests
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include
          core/src/cartridge/SuperFx.cpp tests/test_superfx.cpp -o superfx-tests
      - name: Test Super FX pixel and bus timing
        run: ./superfx-tests
      - name: Build and test handheld components
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Cpu.cpp tests/test_gameboy_cpu.cpp -o gameboy-cpu-tests
          ./gameboy-cpu-tests
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Host.cpp tests/test_gameboy_host.cpp -o gameboy-host-tests
          ./gameboy-host-tests
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/ClockedIo.cpp tests/test_gameboy_clocked_io.cpp -o gameboy-clock-tests
          ./gameboy-clock-tests
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Tpp1.cpp core/src/cartridge/gameboy/Camera.cpp core/src/cartridge/gameboy/Huc3Clock.cpp core/src/cartridge/gameboy/Infrared.cpp core/src/cartridge/gameboy/Cartridge.cpp core/src/cartridge/gameboy/MotionEeprom.cpp \
            tests/test_gameboy_cartridge.cpp -o gameboy-cartridge-tests
          ./gameboy-cartridge-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/{Tpp1,Camera,Huc3Clock,Infrared,Cartridge,MotionEeprom}.cpp \
            tests/test_gameboy_camera.cpp -o gameboy-camera-tests
          ./gameboy-camera-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/{Tpp1,Camera,Huc3Clock,Infrared,Cartridge,MotionEeprom}.cpp \
            tests/test_gameboy_tpp1.cpp -o gameboy-tpp1-tests
          ./gameboy-tpp1-tests
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Cpu.cpp core/src/cartridge/gameboy/ClockedIo.cpp \
            core/src/cartridge/gameboy/Host.cpp core/src/cartridge/gameboy/Tpp1.cpp core/src/cartridge/gameboy/Camera.cpp core/src/cartridge/gameboy/Huc3Clock.cpp core/src/cartridge/gameboy/Infrared.cpp core/src/cartridge/gameboy/Cartridge.cpp \
            core/src/cartridge/gameboy/MotionEeprom.cpp core/src/cartridge/gameboy/StartupState.cpp core/src/cartridge/gameboy/Machine.cpp \
            tests/test_gameboy_machine.cpp -o gameboy-machine-tests
          ./gameboy-machine-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Oam.cpp core/src/cartridge/gameboy/Video.cpp tests/test_gameboy_video.cpp -o gameboy-video-tests
          ./gameboy-video-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/Oam.cpp tests/test_gameboy_oam.cpp -o gameboy-oam-tests
          ./gameboy-oam-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/ClockedIo.cpp core/src/cartridge/gameboy/SoundChannels.cpp \
            tests/test_gameboy_sound_channels.cpp -o gameboy-sound-tests
          ./gameboy-sound-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/ClockedIo.cpp core/src/cartridge/gameboy/SoundChannels.cpp \
            core/src/cartridge/gameboy/Audio.cpp tests/test_gameboy_audio.cpp -o gameboy-audio-tests
          ./gameboy-audio-tests
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Icore/include \
            core/src/cartridge/gameboy/{Cpu,ClockedIo,Host,Tpp1,Camera,Huc3Clock,Infrared,Cartridge,MotionEeprom,StartupState,Machine,Oam,Video,SoundChannels,Audio,Peripherals}.cpp \
            tests/test_gameboy_peripherals.cpp -o gameboy-peripheral-tests
          ./gameboy-peripheral-tests
  windows-build:
    name: windows (${{ matrix.mode }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: regular
            lto: "OFF"
            bundle: "OFF"
          - mode: optimized
            lto: "ON"
            bundle: "ON"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Cache SDL build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: out/build/ci/_deps
          key: sdl-${{ runner.os }}-vs2022-${{ hashFiles('cmake/SDL3.cmake') }}
          restore-keys: sdl-${{ runner.os }}-vs2022-
      - name: Configure
        run: cmake -S . -B out/build/ci -G "Visual Studio 17 2022" -A x64 -DSNES_ENABLE_TESTS=ON -DSNES_ENABLE_LTO=${{ matrix.lto }} -DSNES_BUNDLE_OPTIMIZED_TESTS=${{ matrix.bundle }}
      - name: Build
        if: matrix.mode == 'regular'
        run: cmake --build out/build/ci --config Release --parallel 4
      - name: Test
        if: matrix.mode == 'regular'
        run: ctest --test-dir out/build/ci -C Release --output-on-failure --parallel 4 --timeout 120 --no-tests=error
      - name: Build optimized executables
        if: matrix.mode == 'optimized'
        run: cmake --build out/build/ci --config Release --parallel 4 --target snes_optimized_checks
      - name: Test optimized console and SDL paths
        if: matrix.mode == 'optimized'
        run: >-
          ctest --test-dir out/build/ci -C Release --output-on-failure --parallel 4 --timeout 120 --no-tests=error
          -L optimized
  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ninja-build libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev
          libxi-dev libxfixes-dev libxss-dev xvfb xdotool
      - name: Cache desktop dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: out/build/linux/_deps
          key: desktop-${{ runner.os }}-gcc-${{ hashFiles('cmake/SDL3.cmake', 'cmake/ImGui.cmake') }}
      - name: Configure
        run: cmake -S . -B out/build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNES_ENABLE_LTO=OFF
      - name: Build frontend and desktop checks
        run: >-
          cmake --build out/build/linux --parallel 4 --target snes_frontend snes_desktop_tests
          snes_desktop_application_tests snes_preferences_tests snes_session_tests snes_sdl_video_tests snes_sdl_audio_tests
          snes_sdl_input_tests snes_battery_directory_tests
          snes_state_archive_tests snes_processor_state_tests
          snes_audio_state_tests
      - name: Test shared UI and host services
        run: >-
          ctest --test-dir out/build/linux --output-on-failure --parallel 2 --timeout 120 --no-tests=error
          -R '^snes_(state_archive_tests|processor_state_tests|audio_state_tests|desktop_tests|desktop_application_tests|preferences_tests|session_tests|battery_directory_tests|sdl_video_tests|sdl_input_tests|sdl_audio_[0-9]+)$'
      - name: Test X11 desktop integration
        run: xvfb-run -a env SDL_VIDEODRIVER=x11 SNES_TEST_WINDOW=1 out/build/linux/tests/snes_desktop_tests
      - name: Test native application gamepad shortcuts
        run: xvfb-run -a python3 tests/run_x11_application.py out/build/linux/tests/snes_desktop_application_tests
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: windows-build
    if: ${{ always() }}
    steps:
      - name: Require both Windows configurations
        env:
          WINDOWS_RESULT: ${{ needs.windows-build.result }}
        run: test "$WINDOWS_RESULT" = "success"
